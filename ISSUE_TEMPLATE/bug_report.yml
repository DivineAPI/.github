name: Bug report
description: Something in this repository's code, examples or docs does not work as described.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Before you start:
        - **Security problems** go to [support.divineapi.com](https://support.divineapi.com), never to a public issue (see SECURITY.md).
        - **Questions about the API, plans or your account** go to [support.divineapi.com](https://support.divineapi.com).
        - **Never paste your API key or auth token.** Replace them with `YOUR_API_KEY` and `YOUR_AUTH_TOKEN`.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: input
    id: endpoint
    attributes:
      label: Endpoint or function
      description: The API path and host (for example `POST https://astroapi-3.divineapi.com/indian-api/v3/basic-astro-details`) or the SDK method you called.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps or code to reproduce
      description: The smallest request or script that shows the problem, with credentials replaced.
      render: shell
    validations:
      required: true
  - type: textarea
    id: response
    attributes:
      label: Response you received
      description: The response body (trimmed if long). Include `success` and `msg` if present.
      render: json
  - type: input
    id: version
    attributes:
      label: Package version
      description: For the SDKs, the version from `pip show divineapi`, `npm ls divineapi` or `composer show divineapi/divineapi`.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Language and runtime version, and operating system (for example Python 3.12 on Ubuntu 24.04, Node 20 on Windows 11).
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed my API key and auth token from everything above.
          required: true
        - label: This is not a security vulnerability.
          required: true
        - label: I searched the existing issues for this problem.
          required: false
